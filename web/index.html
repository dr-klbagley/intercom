<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141C2E" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Intercom">
  <title>Intercom</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Line icons (stroke = currentColor), used via <use href="#i-…"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  </svg>

  <header class="bar">
    <div class="brand"><span id="dot" class="dot" title="Checking connection"></span><span class="wordmark">Intercom</span></div>
    <div class="actions">
      <button id="wake" class="pill-btn" aria-pressed="false" title="Listen for “Hey Jarvis” while this page is open">Hey Jarvis</button>
      <button id="mute" class="icon-btn" aria-pressed="false" title="Mute spoken replies" aria-label="Mute spoken replies"><svg class="ico"><use href="#i-volume"/></svg></button>
      <button id="new" class="icon-btn" title="New conversation" aria-label="New conversation"><svg class="ico"><use href="#i-plus"/></svg></button>
    </div>
  </header>

  <main id="log" class="log" aria-live="polite">
    <div class="empty" id="empty">
      <p class="eyebrow">Jarvis</p>
      <h1>What would you like to know?</h1>
      <ul class="hints">
        <li>Any emails from tier 1 senders today?</li>
        <li>What does my calendar look like tomorrow?</li>
        <li>What's in the headlines?</li>
      </ul>
    </div>
  </main>

  <footer class="dock">
    <form id="typed" class="typed" hidden>
      <input id="typed-input" type="text" placeholder="Type a question" autocomplete="off" enterkeyhint="send">
      <button type="submit">Ask</button>
    </form>
    <div class="controls">
      <button id="keyboard" class="icon-btn" title="Type instead" aria-label="Type instead"><svg class="ico"><use href="#i-keyboard"/></svg></button>
      <button id="talk" class="talk" aria-label="Hold to talk">
        <span class="ring"></span><svg class="ico mic"><use href="#i-mic"/></svg>
      </button>
      <div class="state" id="state">Hold to talk</div>
    </div>
  </footer>

  <script src="wakeword.js"></script>
  <script src="app.js"></script>
</body>
</html>
