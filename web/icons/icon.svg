<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3A5E"/>
      <stop offset="1" stop-color="#1A2440"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F2"/>
      <stop offset="1" stop-color="#EADFC8"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: iOS rounds the corners itself. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Sound waves (terracotta) -->
  <g fill="none" stroke="#B3835C" stroke-linecap="round">
    <path d="M266 258 A300 300 0 0 0 266 602" stroke-width="38"/>
    <path d="M758 258 A300 300 0 0 1 758 602" stroke-width="38"/>
    <path d="M193 206 A390 390 0 0 0 193 654" stroke-width="34" opacity=".5"/>
    <path d="M831 206 A390 390 0 0 1 831 654" stroke-width="34" opacity=".5"/>
  </g>
  <!-- Microphone (cream) -->
  <rect x="417" y="196" width="190" height="400" rx="95" fill="url(#mic)"/>
  <g fill="none" stroke="#F0E8D6" stroke-width="44" stroke-linecap="round">
    <path d="M337 470 A175 175 0 0 0 687 470"/>
    <path d="M512 645 V790"/>
    <path d="M422 806 H602"/>
  </g>
</svg>
